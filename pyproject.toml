[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brotli2shell-hunter"
version = "0.1.0"
description = "Read-only, version-independent detector for CVE-2026-111497 (Brotli2Shell / HTTP2Shell / Node2Shell)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []          # core scan is standard-library only

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
b2s-hunt = "b2s_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
